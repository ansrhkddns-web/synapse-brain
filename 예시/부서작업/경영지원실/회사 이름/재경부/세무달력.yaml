    방법: 고지서 · 홈택스 > 납부·고지 > 세금납부
    준비:
      - 고지서(우편·홈택스 전자고지) 확인
      - 매출이 크게 줄었으면 예정신고를 대신 할 수 있는지 세무사에게 확인
    담당: 사람
    근거: 부가가치세법 제48조 제3항
