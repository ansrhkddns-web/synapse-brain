항목:
  # ── 부가가치세 ─────────────────────────────
  - id: 부가세-개인확정
    이름: 부가가치세 확정신고·납부 (개인 일반과세자)
    짧게: 부가세 확정
    분류: 부가세
    대상: [개인일반]
    마감: { 매년: [01-25, 07-25] }
    기간: "{반기} 매출·매입"
    할일: 6개월(1기 1~6월 · 2기 7~12월) 매출세액에서 매입세액을 빼서 신고하고 납부. 예정고지로 낸 세액은 빼고 낸다.
    방법: 홈택스 > 세금신고 > 부가가치세 신고 > 일반과세자 정기신고 (세무사가 있으면 자료만 넘김)
    준비:
      - 매출 세금계산서·계산서 합계 (홈택스 전자세금계산서 조회)
      - 신용카드·현금영수증 매출 합계 (홈택스 > 조회/발급 > 신용카드 매출자료)
      - 매입 세금계산서 합계, 사업용 신용카드 매입 내역 (공제받을 것과 못 받을 것 구분)
      - 현금 매출·플랫폼 정산(음원·영상 플랫폼, 해외 수익) 내역과 입금 통장
      - 예정고지 세액 납부 확인 (4월·10월에 낸 금액)
      - 지난 기간 미공제·수정할 거래 메모
    담당: 사람 (또는 세무사)
    근거: 부가가치세법 제49조
    출처: https://nts.go.kr/nts/ad/taxSchdul/selectList.do?mi=135747
    메모: 영세율(해외 플랫폼 수익 등) 적용이면 증빙(외화 입금 내역)을 같이 챙긴다.

