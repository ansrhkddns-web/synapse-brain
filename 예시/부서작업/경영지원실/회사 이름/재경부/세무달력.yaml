    마감: { 매월: 10 }
    기간: "{전월연도}년 {전월}월 지급분"
    할일: 지난달 급여·용역비·출연료 등을 줄 때 떼어 둔 세금을 신고하고 납부. 지급이 없던 달은 할 일 없음.
    방법: 홈택스 > 세금신고 > 원천세 신고 > 일반(정기)신고 · 지방소득세(특별징수분)는 위택스 연계 납부
    준비:
      - 지난달 급여대장 (근로소득 간이세액표로 뗀 금액)
      - 프리랜서·외주 지급 내역: 이름, 지급액, 원천징수 3.3%(소득세 3% + 지방 0.3%)
      - 기타소득(일회성 강연·출연 등) 지급 내역: 필요경비 60% 뒤 20% → 실효 8.8%
      - 원천징수영수증·지급 통장 내역
    담당: 사람 (또는 세무사)
    근거: 소득세법 제128조
    출처: https://nts.go.kr/nts/ad/taxSchdul/selectList.do?mi=135747
    메모: 반기납부 승인을 받은 사업장(직전 연도 상시 20인 이하, 6월·12월에 신청)은 1/10·7/10에 6개월분을 몰아서 신고·납부한다. 3월 10일분에는 연말정산 결과가 함께 들어간다.

