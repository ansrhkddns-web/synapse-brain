# <회사 이름> 세무달력 — 경영지원실 재경부
# SYNAPSE BRAIN 화면의 "세무달력"(#/calendar)이 이 파일을 읽는다. 형식은 app/lib/taxcal.mjs 머리말.
# 마감은 법정 기본일. 토·일·공휴일이면 화면이 다음 평일로 미뤄 보인다(국세기본법 제5조, 지방세기본법도 같은 취지).
# 해마다 1월에 공휴일·제도 변경을 공식 출처로 다시 확인하고 "확인" 날짜를 고친다.
회사: <회사 이름>
확인: 2026-11-01
범위: { 부터: 2026-10-31, 까지: 2027-12-31 }
프로필: { 형태: 개인간이, 직원: 없음, 프리랜서: 없음 }

알림:
  - "회사 유형: 아직 정하지 않음 — 경영지원실장이 회사정보를 확인해 위 프로필(형태·직원·프리랜서)을 고칩니다."
  - "앱·게임·웹 업종(722000·722001·722002·722005·642004)을 넣으면, 사업장이 서울·광역시 동 지역·수도권 17개 시일 때 다음 과세기간부터 일반과세자예요(부가가치세법 시행령 제110조 제4항, 국세청 고시 제2026-19호). 2026년 안에 넣으면 2027-01-01부터 '개인일반' 마감(4/25 예정고지, 7/25 확정)을 봅니다. 사업장 시·구가 확인되면 경영지원실장이 프로필을 고칩니다."
  - "간이과세자는 1년 공급대가가 4,800만원 미만이면 부가세 납부가 면제되지만 신고(2027-01-25, 2026년분)는 해야 해요(부가가치세법 제69조)."
  - "근로소득 간이지급명세서는 2027년 1월 지급분부터 매월(다음 달 말일) 냅니다. 2026년 하반기분은 반기로 2027-02-01까지."
  - "2026 세제개편안: 프리랜서(사업소득) 원천징수 3.3% → 2.2%를 2027-01-01 지급분부터 적용하는 안이 있으나 2026-11-01 현재 국회 통과 전이에요. 확정되면 원천세 안내를 고칩니다."
  - "국세청이 연휴 때 기한을 따로 늘리기도 해요(예: 2025 추석 원천세 10/15). 공지가 나오면 이 파일에 반영합니다."

# 공휴일 (대체공휴일 포함): 2026-11~12 · 2027 — 한국천문연구원 월력, 우주항공청 2027 월력요항(2026-06-29 발표). 2026년부터 노동절(5/1)도 공휴일.
